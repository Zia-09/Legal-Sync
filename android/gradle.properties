org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
android.enableJetifier=true
# Avoid intermittent Kotlin incremental cache failures on Windows when project and Pub cache live on different drives.
kotlin.incremental=false
kotlin.incremental.android=false
# Force low-memory build settings
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx384M

