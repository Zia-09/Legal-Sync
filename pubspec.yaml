name: legal_sync
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^21.0.0-dev.2
  firebase_messaging: ^16.2.2
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  pdf: ^3.12.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  firebase_storage: ^13.2.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  google_mlkit_text_recognition: ^0.15.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  dots_indicator: ^4.0.1
  supabase_flutter: ^2.12.2
  fl_chart: ^1.2.0
  url_launcher: ^6.2.6
  http: ^1.6.0
  crypto: ^3.0.3
  flutter_dotenv: ^6.0.1
  animate_do: ^5.1.0
  audioplayers: ^6.6.0
  syncfusion_flutter_pdfviewer: ^33.2.6
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  flutter_launcher_icons: ^0.13.1
  


flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/sounds/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
